[package]
name = "devp2p"
version = "0.1.0"
edition = "2021"
description = "Ethereum DevP2P networking implementation"
authors = ["yibai"]

[dependencies]
# Reuse our primitives library
eth_primitives = { path = "../rust-eth-primitives" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Crypto
k256 = "0.13"
rand = "0.8"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha2 = "0.10"

# RLP encoding
alloy-rlp = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Hex encoding
hex = "0.4"

# Logging
tracing = "0.1"

[[bin]]
name = "devp2p"
path = "src/main.rs"
