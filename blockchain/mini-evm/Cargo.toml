[package]
name = "mini_evm"
version = "0.1.0"
edition = "2021"
description = "A minimal EVM interpreter implementation"

[dependencies]
# Use our primitives library
eth_primitives = { path = "../rust-eth-primitives" }

# Utilities
hex = "0.4"
thiserror = "1.0"

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "evm"
path = "src/main.rs"

[lib]
name = "mini_evm"
path = "src/lib.rs"
