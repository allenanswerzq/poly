[package]
name = "eth_primitives"
version = "0.1.0"
edition = "2021"
description = "Low-level Ethereum primitives implemented from scratch"

[dependencies]
# Cryptography
k256 = { version = "0.13", features = ["ecdsa", "ecdsa-core"] }
sha3 = "0.10"
tiny-keccak = { version = "2.0", features = ["keccak"] }

# Encoding
alloy-rlp = "0.3"
hex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Arbitrary precision integers (for reference/testing)
primitive-types = "0.12"
uint = "0.9"

[dev-dependencies]
rand = "0.8"
proptest = "1.4"

[[bin]]
name = "demo"
path = "src/main.rs"

[lib]
name = "eth_primitives"
path = "src/lib.rs"
