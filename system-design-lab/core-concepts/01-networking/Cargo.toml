[package]
name = "networking"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "networking"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
sha1 = "0.10"
base64 = "0.22"
axum = "0.7"
reqwest = { version = "0.12", features = ["blocking", "stream"] }
serde_json = { workspace = true }
async-stream = "0.3"
bytes = { workspace = true }
futures = { workspace = true }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"
