[package]
name = "mini_rollup"
version = "0.1.0"
edition = "2021"
description = "Minimal L2 Sequencer Prototype"
authors = ["yibai"]

[dependencies]
# Reuse our primitives library
eth_primitives = { path = "../rust-eth-primitives" }

# Reuse MPT for state roots
mpt_trie = { path = "../mpt-trie" }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Hex encoding
hex = "0.4"

# Time
chrono = "0.4"

[[bin]]
name = "sequencer"
path = "src/main.rs"
